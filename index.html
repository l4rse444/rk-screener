// ─── FINNHUB ─────────────────────────────────────────────────────
async function fh(path) {
  const sep=path.includes('?')?'&':'?'
  const url=`https://finnhub.io/api/v1${path}${sep}token=${FINNHUB_KEY}`
  const res=await fetch(PROXY+encodeURIComponent(url))
  if(!res.ok) throw new Error(`${res.status}`)
  return res.json()
}

async function getStockData(ticker) {
  const [quote,metrics]=await Promise.all([
    fh(`/quote?symbol=${ticker}`),
    fh(`/stock/metric?symbol=${ticker}&metric=all`)
  ])
  if(!quote?.c||quote.c===0) return null
  const m=metrics?.metric||{}
  return {
    ticker, name:ticker,
    price:quote.c,
    yearHigh:m['52WeekHigh']||quote.h,
    yearLow:m['52WeekLow']||quote.l,
    change:quote.pc>0?((quote.c-quote.pc)/quote.pc*100):null,
    trailingPE:m.peNormalizedAnnual||m.peTTM||null,
    priceToBook:m.pbAnnual||m.pbQuarterly||null,
    fcfYield:m.fcfYieldTTM?m.fcfYieldTTM/100:null,
    currentRatio:m.currentRatioAnnual||m.currentRatioQuarterly||null,
    marketCap:m.marketCapitalization?m.marketCapitalization*1e6:null,
  }
}

async function getInsider(ticker) {
  try {
    const from=new Date(Date.now()-90*24*60*60*1000).toISOString().split('T')[0]
    const to=new Date().toISOString().split('T')[0]
    const data=await fh(`/stock/insider-transactions?symbol=${ticker}&from=${from}&to=${to}`)
    const buys=(data?.data||[]).filter(t=>t.transactionCode==='P'&&t.share>0)
      .map(t=>({value:t.share*(t.transactionPrice||0)})).filter(t=>t.value>=200000)
    return {buys}
  } catch {return {buys:[]}}
}

// ─── SCORER ──────────────────────────────────────────────────────
function scoreStock(q,ins) {
  let score=0,signals=[],insiderBuyCount=0,squeezePotential=false
  const {trailingPE:pe,priceToBook:pb,fcfYield:fcfY,currentRatio:cr}=q

  if(pb>0&&pb<1)       {score+=25;signals.push({l:`P/B ${pb.toFixed(2)}`,t:'hot'})}
  else if(pb>0&&pb<2)  {score+=15;signals.push({l:`P/B ${pb.toFixed(2)}`,t:'pass'})}
  else if(pb>0&&pb<3)  {score+=5; signals.push({l:`P/B ${pb.toFixed(2)}`,t:'warn'})}
  else if(pb>0)        {signals.push({l:`P/B ${pb.toFixed(2)}`,t:'fail'})}
  else                 {signals.push({l:'No P/B data',t:'fail'})}

  if(pe>0&&pe<10)      {score+=20;signals.push({l:`P/E ${pe.toFixed(1)}`,t:'hot'})}
  else if(pe>0&&pe<15) {score+=12;signals.push({l:`P/E ${pe.toFixed(1)}`,t:'pass'})}
  else if(pe>0&&pe<25) {score+=5; signals.push({l:`P/E ${pe.toFixed(1)}`,t:'warn'})}
  else if(pe>0)        {signals.push({l:`P/E ${pe.toFixed(1)}`,t:'fail'})}
  else                 {signals.push({l:'No P/E data',t:'fail'})}

  if(fcfY>0.08)        {score+=15;signals.push({l:`FCF ${(fcfY*100).toFixed(1)}%`,t:'pass'})}
  else if(fcfY>0.03)   {score+=7; signals.push({l:`FCF ${(fcfY*100).toFixed(1)}%`,t:'warn'})}
  else if(fcfY!=null)  {signals.push({l:`FCF ${(fcfY*100).toFixed(1)}%`,t:'fail'})}

  if(q.price&&q.yearHigh&&q.yearLow){
    const rng=q.yearHigh-q.yearLow
    const pos=rng>0?(q.price-q.yearLow)/rng:null
    if(pos!==null&&pos<0.2)      {score+=15;signals.push({l:'Near 52w low',t:'hot'})}
    else if(pos!==null&&pos<0.4) {score+=8; signals.push({l:'Below 52w mid',t:'pass'})}
    else if(pos!==null)          {signals.push({l:'Near 52w high',t:'fail'})}
  }

  const bigBuys=ins?.buys||[]
  insiderBuyCount=bigBuys.length
  if(bigBuys.length>=5)      {score+=20;signals.push({l:`${bigBuys.length} insider buys`,t:'hot'})}
  else if(bigBuys.length>=2) {score+=12;signals.push({l:`${bigBuys.length} insider buys $200k+`,t:'pass'})}
  else if(bigBuys.length===1){score+=5; signals.push({l:'1 insider buy',t:'warn'})}
  else                       {signals.push({l:'No insider buys',t:'fail'})}

  if(cr>2)      {score+=5;signals.push({l:`Current ratio ${cr.toFixed(1)}`,t:'pass'})}
  else if(cr>1) {score+=2;signals.push({l:`Current ratio ${cr.toFixed(1)}`,t:'warn'})}
  else if(cr)   {signals.push({l:`Current ratio ${cr.toFixed(1)}`,t:'fail'})}

  return {score:Math.min(100,score),signals,insiderBuyCount,squeezePotential,topPick:score>=55}
}

// ─── AI ──────────────────────────────────────────────────────────
async function getAI(ticker,name,score,signals,q) {
  const pass=signals.filter(s=>s.t==='pass'||s.t==='hot').map(s=>s.l).join(', ')
  const fail=signals.filter(s=>s.t==='fail').map(s=>s.l).join(', ')
  const res=await fetch(ANT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    model:'claude-sonnet-4-20250514',max_tokens:1000,
    messages:[{role:'user',content:`Deep value investor analyzing ${ticker}. RK score: ${score}/100. Passing: ${pass||'none'}. Failing: ${fail||'none'}. P/E: ${q.trailingPE>0?q.trailingPE.toFixed(1):'N/A'}, P/B: ${q.priceToBook>0?q.priceToBook.toFixed(2):'N/A'}, mkt cap: ${fmtMcap(q.marketCap)}. Write exactly 2 sentences: bull case and key risk. Specific and data-driven.`}]
  })})
  const d=await res.json()
  return d.content?.[0]?.text||''
}

  activeFilters.hasInsider = $('f_insider')?.checked||false

function getFilteredResults() {
  const f=activeFilters
  return scanResults.filter(r=>{
    if(r.score < f.minScore) return false
    if(f.onlyTopPicks && !r.topPick) return false
    if(f.onlySqueeze && !r.squeezePotential) return false
    if(f.maxPB>0 && (r.quote?.priceToBook<=0||r.quote?.priceToBook>f.maxPB)) return false
    if(f.maxPE>0 && (r.quote?.trailingPE<=0||r.quote?.trailingPE>f.maxPE)) return false
    if(f.near52wLow) {
      const q=r.quote; if(!q?.price||!q?.yearHigh||!q?.yearLow) return false
      const rng=q.yearHigh-q.yearLow; if(rng<=0) return false
      const pos=(q.price-q.yearLow)/rng
      if(pos>0.4) return false
    }
    if(f.hasInsider && r.insiderBuyCount===0) return false
    return true
  }).sort((a,b)=>{
    const s=f.sortBy
    if(s==='pb') return (a.quote?.priceToBook||99)-(b.quote?.priceToBook||99)
    if(s==='pe') return (a.quote?.trailingPE||999)-(b.quote?.trailingPE||999)
    if(s==='fcf') return (b.quote?.fcfYield||0)-(a.quote?.fcfYield||0)
    if(s==='insider') return b.insiderBuyCount-a.insiderBuyCount
    if(s==='52wlow') {
      const pos=r=>{const q=r.quote;if(!q?.price||!q?.yearHigh||!q?.yearLow)return 1;const rng=q.yearHigh-q.yearLow;return rng>0?(q.price-q.yearLow)/rng:1}
      return pos(a)-pos(b)
    }
    if(s==='mcap') return (a.quote?.marketCap||9e12)-(b.quote?.marketCap||9e12)
    if(s==='change') return (a.quote?.change||0)-(b.quote?.change||0)
    if(s==='score_asc') return a.score-b.score
    // default: top picks first then by score
    return ((b.topPick?200:0)+b.score)-((a.topPick?200:0)+a.score)
  })
}

function renderScreener() {
  renderFilterPanel()
  const filtered=getFilteredResults()
  const list=$('stockList')
  if(!list) return
  if(!filtered.length&&!scanResults.length){
    list.innerHTML=`<div style="text-align:center;padding:4rem 1rem;color:var(--text3)">Hit <strong>Scan watchlist</strong> to start finding deep value opportunities</div>`
  } else if(!filtered.length){
    list.innerHTML=`<div style="text-align:center;padding:3rem 1rem;color:var(--text2);background:var(--bg2);border-radius:var(--rxl);border:1px solid var(--border)"><div style="font-size:28px;margin-bottom:8px">🔍</div>No stocks match your current filters — try relaxing them</div>`
  } else {
    list.innerHTML=filtered.map(stockCard).join('')
  }
  if($('mScanned'))  $('mScanned').textContent=scanResults.length
  if($('mShowing'))  $('mShowing').textContent=filtered.length
  if($('mTopPicks')) $('mTopPicks').textContent=scanResults.filter(r=>r.topPick).length
  if($('mSqueeze'))  $('mSqueeze').textContent=scanResults.filter(r=>r.squeezePotential).length
}

async function startScan() {
  if(scanning) return
  scanning=true; scanResults=[]
  const limit=$('scanLimit').value
  const tickers=limit==='all'?[...customWatchlist]:customWatchlist.slice(0,parseInt(limit))
  const btn=$('scanBtn')
  btn.disabled=true; btn.textContent='Scanning...'
  $('scanStatus').style.display='flex'
  $('progressBar').style.display='block'
  $('metricsRow').style.display='grid'
  $('filterSection').style.display='block'
  let failed=0

  for(let i=0;i<tickers.length;i++){
    const ticker=tickers[i]
    $('scanStatusTxt').textContent=`Analyzing ${ticker} (${i+1} of ${tickers.length})${failed>0?' · '+failed+' skipped':''}`
    $('progressFill').style.width=Math.round((i/tickers.length)*90)+'%'
    try{
      const [quote,insider]=await Promise.all([getStockData(ticker),getInsider(ticker)])
      if(quote){
        const {score,signals,insiderBuyCount,squeezePotential,topPick}=scoreStock(quote,insider)
        let aiAnalysis=''
        if(score>=45){try{aiAnalysis=await getAI(ticker,quote.name,score,signals,quote)}catch{}}
        scanResults.push({ticker,quote,score,signals,insiderBuyCount,squeezePotential,topPick,aiAnalysis})
        renderScreener()
      } else failed++
    } catch(e){failed++;console.warn(ticker,e.message)}
    await delay(600)
  }

  $('progressFill').style.width='100%'
  const dot=$('scanStatusDot')
  dot.style.background='var(--green)';dot.style.animation='none'
  $('scanStatusTxt').textContent=`Scan complete — ${scanResults.length} stocks analyzed${failed>0?', '+failed+' skipped':''}`
  btn.disabled=false;btn.textContent='↗  Scan watchlist'
  scanning=false
  renderScreener()
}

function addCustom(){
  const inp=$('customInput')
  inp.value.split(',').map(t=>t.trim().toUpperCase()).filter(Boolean).forEach(t=>{
    if(!customWatchlist.includes(t)) customWatchlist.push(t)
  })
  inp.value=''
  if($('watchlistCount')) $('watchlistCount').textContent=customWatchlist.length+' tickers in watchlist'
}

// ─── PORTFOLIO ───────────────────────────────────────────────────
function buyStock(ticker,name,priceEur,rkScore){
  const amt=parseFloat($('amt_'+ticker)?.value||500)
  if(isNaN(amt)||amt<=0){alert('Enter a valid EUR amount');return}
  if(amt>portfolio.cash){alert('Not enough cash. Available: '+fmtEur(portfolio.cash));return}
  const shares=amt/priceEur
  const ex=portfolio.positions.find(p=>p.ticker===ticker)
  if(ex){ex.avgPrice=(ex.avgPrice*ex.shares+priceEur*shares)/(ex.shares+shares);ex.shares+=shares;ex.invested+=amt}
  else portfolio.positions.push({ticker,name,avgPrice:priceEur,shares,invested:amt,rkScore,buyDate:new Date().toLocaleDateString('en-GB')})
  portfolio.cash-=amt;priceCache[ticker]=priceEur
  save();updateTabBadge()
  alert(`✓ Bought €${amt.toFixed(2)} of ${ticker} at €${priceEur.toFixed(2)}/share\n\nSwitch to the Portfolio tab to track it!`)
}

async function refreshPrices(){
  const btn=$('refBtn')
  if(btn){btn.disabled=true;btn.textContent='Updating...'}
  for(const pos of portfolio.positions){
    try{const q=await fh(`/quote?symbol=${pos.ticker}`);if(q?.c)priceCache[pos.ticker]=toEur(q.c)}catch{}
    await delay(400)
  }
  if(btn){btn.disabled=false;btn.textContent='↺  Refresh prices'}
  if($('lastRefresh')) $('lastRefresh').textContent='Updated '+new Date().toLocaleTimeString('en-GB')
  renderPortfolio()
}

function sellStock(ticker){
  const pos=portfolio.positions.find(p=>p.ticker===ticker)
  if(!pos) return
  const live=priceCache[ticker]||pos.avgPrice
  const sv=live*pos.shares,pnl=sv-pos.invested,pct=pos.invested>0?(pnl/pos.invested)*100:0
  if(!confirm(`Sell ${pos.shares.toFixed(3)} shares of ${ticker} at ${fmtEur(live)}?\n\nSale: ${fmtEur(sv)}\nP&L: ${pnl>=0?'+':''}${fmtEur(pnl)} (${fmtPct(pct)})`)) return
  portfolio.closed.push({ticker,name:pos.name,buyDate:pos.buyDate,sellDate:new Date().toLocaleDateString('en-GB'),avgCost:pos.avgPrice,sellPrice:live,shares:pos.shares,invested:pos.invested,saleValue:sv,pnl,pct,rkScore:pos.rkScore||0})
  portfolio.positions=portfolio.positions.filter(p=>p.ticker!==ticker)
  portfolio.cash+=sv;save();renderPortfolio();updateTabBadge()
}

function renderPortfolio(){
  const inv=portfolio.positions.reduce((a,p)=>a+p.invested,0)
  const cur=portfolio.positions.reduce((a,p)=>a+(priceCache[p.ticker]||p.avgPrice)*p.shares,0)
  const pnl=cur-inv,pct=inv>0?(pnl/inv)*100:0
  if($('pCash')) $('pCash').textContent=fmtEur(portfolio.cash)
  if($('pInvested')) $('pInvested').textContent=fmtEur(inv)
  if($('pValue')) $('pValue').textContent=fmtEur(portfolio.cash+cur)
  if($('pPnl')){$('pPnl').textContent=(pnl>=0?'+':'-')+fmtEur(pnl)+' ('+fmtPct(pct)+')';$('pPnl').style.color=pnl>0?'var(--green)':pnl<0?'var(--red)':'var(--text)'}
  const tb=$('portTbody');if(!tb) return
  if(!portfolio.positions.length){tb.innerHTML=`<tr><td colspan="9" style="text-align:center;padding:3rem;color:var(--text3)">No positions yet — buy stocks from the Screener tab</td></tr>`;return}
  tb.innerHTML=portfolio.positions.map(pos=>{
    const live=priceCache[pos.ticker]||pos.avgPrice,val=live*pos.shares
    const p=pos.invested>0?((val-pos.invested)/pos.invested)*100:0,pv=val-pos.invested
    return `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:12px 14px"><strong style="font-family:var(--mono)">${pos.ticker}</strong><div style="font-size:11px;color:var(--text3)">${(pos.name||'').substring(0,18)}</div></td>
      <td style="padding:12px 14px;font-family:var(--mono);font-size:12px;color:var(--text2)">${pos.shares.toFixed(3)}</td>
      <td style="padding:12px 14px;font-family:var(--mono);font-size:12px;font-weight:500">${fmtEur(pos.avgPrice)}</td>
      <td style="padding:12px 14px;font-family:var(--mono);font-size:12px">${fmtEur(live)}${!priceCache[pos.ticker]?'<div style="font-size:10px;color:var(--text3)">entry price</div>':''}</td>
      <td style="padding:12px 14px;font-family:var(--mono);font-size:12px;color:var(--text2)">${fmtEur(pos.invested)}</td>
      <td style="padding:12px 14px;font-family:var(--mono);font-size:12px;font-weight:500">${fmtEur(val)}</td>
      <td style="padding:12px 14px;font-family:var(--mono);font-size:12px;font-weight:700;color:${pv>=0?'var(--green)':'var(--red)'}">${pv>=0?'+':'-'}${fmtEur(pv)}<div style="font-size:11px">${fmtPct(p)}</div></td>
      <td style="padding:12px 14px"><span style="font-size:12px;font-weight:600;background:var(--bg3);color:var(--text2);padding:2px 8px;border-radius:6px;border:1px solid var(--border)">${pos.rkScore||'—'}</span></td>
      <td style="padding:12px 14px"><button onclick="sellStock('${pos.ticker}')" style="font-size:12px;padding:5px 12px;color:var(--red);border-color:var(--red-border);background:var(--red-bg)">Sell</button></td>
    </tr>`
  }).join('')
}

function renderPerformance(){
  const c=portfolio.closed,n=c.length,wins=c.filter(t=>t.pnl>0).length
  if($('lgTotal')) $('lgTotal').textContent=n
  if($('lgWin')) $('lgWin').textContent=n>0?(wins/n*100).toFixed(0)+'%':'—'
  if($('lgAvg')) $('lgAvg').textContent=n>0?(c.reduce((a,b)=>a+b.pct,0)/n).toFixed(1)+'%':'—'
  if($('lgBest')) $('lgBest').textContent=n>0?Math.max(...c.map(t=>t.pct)).toFixed(1)+'%':'—'
  const tb=$('logTbody');if(!tb) return
  if(!c.length){tb.innerHTML=`<tr><td colspan="9" style="text-align:center;padding:3rem;color:var(--text3)">Closed trades will appear here</td></tr>`;return}

    <td style="padding:12px 14px;font-weight:700;color:${t.pct>=0?'var(--green)':'var(--red)'};font-family:var(--mono);font-size:12px">${fmtPct(t.pct)}</td>
    <td style="padding:12px 14px"><span style="font-size:12px;font-weight:600;background:var(--bg3);color:var(--text2);padding:2px 8px;border-radius:6px;border:1px solid var(--border)">${t.rkScore}</span></td>

      <div style="overflow-x:auto">

          <thead><tr style="background:var(--bg3)">${['Stock','Shares','Avg cost','Live price','Invested','Value','P&L','Score',''].map(thdr).join('')}</tr></thead>
          <tbody id="portTbody"></tbody>
        </table>
      </div>
    </div>`
    renderPortfolio();refreshPrices()
  }

  else if(idx===2){
    mc.innerHTML=`
    <div style="margin-bottom:24px">
      <h2 style="font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px">Performance</h2>
      <p style="font-size:14px;color:var(--text2)">Track your closed trades and see how the RK model performs over time</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px">
      ${[['Total trades','lgTotal'],['Win rate','lgWin'],['Avg return','lgAvg'],['Best trade','lgBest']].map(([l,id])=>`
        <div style="background:var(--bg2);border-radius:var(--rl);padding:14px 16px;border:1px solid var(--border);box-shadow:var(--sh)">
          <div class="lbl">${l}</div>
          <div id="${id}" style="font-size:24px;font-weight:700;letter-spacing:-.5px;font-family:var(--mono)">—</div>
        </div>`).join('')}
    </div>
    <div style="background:var(--bg2);border-radius:var(--rxl);border:1px solid var(--border);box-shadow:var(--sh);overflow:hidden">
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="background:var(--bg3)">${['Stock','Bought','Sold','Invested','Sale value','P&L','Return','RK Score','Result'].map(thdr).join('')}</tr></thead>
          <tbody id="logTbody"></tbody>
        </table>
      </div>
    </div>`
    renderPerformance()
  }
}

function init(){
  const tc=$('tabBtns')
  TABS.forEach((t,i)=>{
    const btn=document.createElement('button')
    btn.className='tbtn'
    btn.textContent=t
    btn.style.cssText='border-radius:8px;padding:5px 14px;font-size:13px;'
    btn.onclick=()=>switchTab(i)
    tc.appendChild(btn)
  })
  switchTab(0);updateTabBadge()
}
init()
</script>
</body>
</html>
